<h3>Non‑Ohmic Copper Wire Simulation</h3>

<div class="editor">

<pre id="lineNumbers"></pre>

<textarea id="code">
import numpy as np
import matplotlib.pyplot as plt

# Constants
R0 = 1.0
rho0 = 1.68e-8
T0 = 293
alpha = 0.00386
beta = 0.000005
m = 0.01
C = 385
time_interval = 1

def resistivity(T):
    return rho0 * (1 + alpha*(T-T0) + beta*(T-T0)**2)

def resistance(T):
    return R0 * resistivity(T) / rho0

def update_temperature(I,R,T):
    P = I**2 * R
    delta_T = P * time_interval / (m*C)
    return T + delta_T

voltages = np.linspace(0,10,200)

currents=[]
temperatures=[T0]

for V in voltages:
    R = resistance(temperatures[-1])
    I = V/R
    currents.append(I)
    new_T = update_temperature(I,R,temperatures[-1])
    temperatures.append(new_T)

plt.figure(figsize=(10,5))
plt.plot(voltages,currents,label='Current (A)')

plt.xlabel("Voltage (V)")
plt.ylabel("Current (A)")

plt.title("Current vs Voltage Showing Non‑Ohmic Behavior of Copper")
plt.grid(True)
plt.legend()

plt.show()
</textarea>

</div>

<button onclick="run()">Run</button>

<div id="plot"></div>

<script>

let pyodideReady = loadPyodide()

const code=document.getElementById("code")
const lines=document.getElementById("lineNumbers")

function updateLines(){
let n=code.value.split("\n").length
let s=""
for(let i=1;i<=n;i++) s+=i+"\n"
lines.textContent=s
}

code.addEventListener("input",updateLines)
code.addEventListener("scroll",()=>lines.scrollTop=code.scrollTop)

updateLines()

async function run(){

let pyodide=await pyodideReady

await pyodide.loadPackage(["numpy","matplotlib"])

await pyodide.runPythonAsync(`
import sys,io
from io import BytesIO
import matplotlib
matplotlib.use("AGG")
sys.stdout=io.StringIO()
`)

await pyodide.runPythonAsync(code.value)

let img=await pyodide.runPythonAsync(`
buf=BytesIO()
plt.savefig(buf,format='png')
buf.seek(0)
import base64
base64.b64encode(buf.read()).decode()
`)

document.getElementById("plot").innerHTML =
"<img src='data:image/png;base64,"+img+"'/>"

}

</script>
