
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CH2_EXIT_QUIZ</title>

<style>
body{font-family:system-ui,sans-serif;line-height:1.45;margin:0;padding:24px;background:radial-gradient(circle at top,#1b2745,#090a0f);color:#f2f2f2}
#quiz{max-width:760px;margin:auto;background:#121212;border:1px solid #2c2c2c;border-radius:18px;padding:24px;box-shadow:0 0 25px rgba(0,0,0,.4)}
.quiz-header{text-align:center;margin-bottom:18px}
.subtitle{color:#9fdcff}
.progress-wrap{width:100%;height:10px;background:#222;border-radius:20px;overflow:hidden;margin-bottom:18px}
#progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#00ff99)}
#question{margin:.8rem 0 1rem;font-size:1.08rem;font-weight:500}
button{border:1px solid #333;border-radius:12px;padding:14px;background:#181818;color:#f2f2f2;cursor:pointer;text-align:left;font:inherit;display:block;margin:.25rem 0}
button:hover{border-color:#00d4ff}
.correct{color:#00ff88}.incorrect{color:#ff6666}
#restart{display:none;margin-top:1rem}
</style>
</head>

<body>

<div id="quiz">
<div class="quiz-header"><h1>PH115 Exit Quiz</h1><div class="subtitle">Electric Current</div></div>
<div class="progress-wrap"><div id="progress-bar"></div></div>
<h3 id="progress"></h3>
<div id="question"></div>
<div id="choices"></div>
<div id="feedback" style="margin-top:.75rem"></div>
<button id="restart">Restart</button>
</div>

<script>

const QUIZ = [
{q:"Ohm’s law", c:["applies across all devices","is very restricted in its application by the voltage and current range"], a:1},
{q:"A semiconductor is a typical", c:["Ohmic element","non Ohmic element"], a:1},
{q:"Resistivity depends on", c:["the collision time between charge carriers","the length of the wire","the cross-section of the wire","none of these"], a:0},
{q:"If the length of the wire is doubled, its resistance", c:["doubles","become half","remains constant","none of these apply"], a:0},
{q:"If the length of the wire is doubled, its resistivity", c:["doubles","becomes half","remains constant","none of these apply"], a:2},
{q:"If the cross section of the wire is doubled, its resistivity", c:["doubles","becomes half","remains constant","none of these apply"], a:2},
{q:"If the cross section of the wire is doubled, its resistance", c:["doubles","becomes half","remains constant","none of these apply"], a:1},
{q:"The main carriers of current in a wire are", c:["protons","electrons","positive ions","none of these apply"], a:1},
{q:"The electric field inside a current carrying wire is", c:["zero","non-zero"], a:1},
{q:"Two identical wires carry 1 A. One is DC and the other 1 A (max) AC. Which heats faster?", c:["the DC","the AC","the same time"], a:0},
{q:"The voltage and current across a resistor in AC are", c:["in phase","90° off","180° off","more information is required"], a:0},
{q:"Effective resistance of two resistors in parallel in DC vs AC is", c:["higher in DC","higher in AC","the same in both"], a:2},
{q:"The RMS quantity for 1 A current is about", c:["1.7 A","0.7 A","1 A","none of these"], a:1},
{q:"Kirchhoff rules in AC domain are", c:["applicable exactly as in DC","not applicable as in DC","depends if resistor is Ohmic","more information needed"], a:0},
{q:"RMS of AC source with 10 V max at 100 Hz vs 200 Hz", c:["about 7.07 V in both cases","about 7.07 and 3.53 V","about 7.07 and 14.14 V","none of these"], a:0}
];

let index=0;
let score=0;
let activeQuiz=[];

const progress=document.getElementById("progress");
const question=document.getElementById("question");
const choices=document.getElementById("choices");
const feedback=document.getElementById("feedback");
const restart=document.getElementById("restart");

function render(){

const q=activeQuiz[index];

progress.textContent=`Question ${index+1} of ${activeQuiz.length} · Score: ${score}/${activeQuiz.length}`;
document.getElementById("progress-bar").style.width=(index/activeQuiz.length*100)+"%";
question.textContent=q.q;

choices.innerHTML="";
feedback.textContent="";feedback.className="";

q.c.forEach((choice,i)=>{

let b=document.createElement("button");
b.textContent=String.fromCharCode(97+i)+") "+choice;

b.onclick=()=>select(i);

choices.appendChild(b);

});

}

function select(i){

const q=activeQuiz[index];

if(i!==q.a){

question.textContent="";
choices.innerHTML="";
progress.textContent="";
feedback.className="incorrect";feedback.textContent="Incorrect — restarting from Question 1…";
restart.style.display="inline-block";

restart.onclick=start;

return;

}

score++;
index++;

if(index<activeQuiz.length){

render();

}else{

progress.textContent="";
question.textContent="";
choices.innerHTML="";
feedback.className="correct";feedback.innerHTML=`✅ Perfect! You answered all questions correctly.<br>Score: ${score}/${activeQuiz.length}`;
restart.style.display="inline-block";
restart.onclick=start;

}

}

function start(){

index=0;
score=0;
activeQuiz=[...QUIZ];
for(let i=activeQuiz.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[activeQuiz[i],activeQuiz[j]]=[activeQuiz[j],activeQuiz[i]];
}
restart.style.display="none";
render();

}

start();

</script>

</body>
</html>
